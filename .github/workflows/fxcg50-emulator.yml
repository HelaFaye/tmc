name: fx-CG50 emulator smoke test

on:
  push:
    branches:
      - master
      - fx-cg50
    paths:
      - "port/fxcg/**"
      - "port/port_*.c"
      - "src/**"
      - "include/**"
      - "build/USA/assets/**"
      - "scripts/fxcg/**"
      - "tests/fxcg50-emulator/**"
      - "tests/fxcg50-tlb-probe/**"
      - "tests/fxcg50-p2-exec-probe/**"
      - "tests/fxcg50-p2-bl-rb-probe/**"
      - ".github/workflows/fxcg50-emulator.yml"
  pull_request:
    paths:
      - "port/fxcg/**"
      - "port/port_*.c"
      - "src/**"
      - "include/**"
      - "build/USA/assets/**"
      - "scripts/fxcg/**"
      - "tests/fxcg50-emulator/**"
      - "tests/fxcg50-tlb-probe/**"
      - "tests/fxcg50-p2-exec-probe/**"
      - "tests/fxcg50-p2-bl-rb-probe/**"
      - ".github/workflows/fxcg50-emulator.yml"
  workflow_dispatch:
    inputs:
      refresh_toolchain:
        description: "Ignore the cached fxSDK/SH-4A toolchain layers and rebuild them"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fxcg50-emulator:
    name: Build and boot Picori in Casio emulator
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out Picori
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Check out fxSDK toolchain recipe
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: hexbinoct/casio-cg50
          ref: deeaa627cd7e1aeb14339b14eb4f3a1f0375f07a
          path: .cache/fxsdk-source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build fxSDK and SH-4A toolchain image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .cache/fxsdk-source/tools/fxsdk-docker
          file: .cache/fxsdk-source/tools/fxsdk-docker/Dockerfile
          tags: fxsdk-ci:latest
          load: true
          push: false
          cache-from: type=gha,scope=fxsdk-sh4a-deeaa627
          cache-to: type=gha,mode=max,scope=fxsdk-sh4a-deeaa627
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_toolchain }}

      - name: Build Picori and the Gint TLB-hook link probe
        shell: bash
        run: |
          # Picori keeps Gint's default TLB handler. The second target is a
          # link-only symbol-resolution probe whose stub is never executed.
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work/port/fxcg \
            fxsdk-ci:latest \
            sh -c 'command -v fxsdk && fxsdk build-cg -c -DTMC_FXCG_EMULATOR_TEST=ON -DTMC_FXCG_TLBH_LINK_PROBE=ON -DTMC_FXCG_TLB_STATE_PROBE=ON -DTMC_FXCG_OS_PAGING_PROBE=ON -DTMC_FXCG_P2_EXEC_PROBE=ON -DTMC_FXCG_P2_BL_RB_PROBE=ON && fxsdk build-cg'

          G3A="$(find port/fxcg -type f -name 'Picori.g3a' -print -quit)"
          test -n "$G3A"
          printf 'FXSDK_G3A=%s\n' "$G3A" >> "$GITHUB_ENV"
          echo "Built $G3A"
          PROBE_ELF="$(find port/fxcg/build-cg -maxdepth 2 -type f -name 'fxcg_tlbh_link_probe' -print -quit)"
          test -n "$PROBE_ELF"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            fxsdk-ci:latest \
            sh -c 'python3 tests/fxcg50-tlb-probe/verify_link.py "$1"' sh "$PROBE_ELF"
          PROBE_G3A="$(find port/fxcg -type f -name 'TLBH-LINK-PROBE-DO-NOT-RUN.g3a' -print -quit)"
          test -n "$PROBE_G3A"
          echo "Built link-only probe $PROBE_G3A (not executed)"
          TLB_STATE_PROBE_G3A="$(find port/fxcg -type f -name 'TLB-STATE-PROBE.g3a' -print -quit)"
          test -n "$TLB_STATE_PROBE_G3A"
          printf 'FXCG_TLB_STATE_PROBE_G3A=%s\n' "$TLB_STATE_PROBE_G3A" >> "$GITHUB_ENV"
          echo "Built read-only UTLB state probe $TLB_STATE_PROBE_G3A"
          OS_PAGING_PROBE_G3A="$(find port/fxcg -type f -name 'OS-PAGING-PROBE.g3a' -print -quit)"
          test -n "$OS_PAGING_PROBE_G3A"
          printf 'OS_PAGING_PROBE_G3A=%s\n' "$OS_PAGING_PROBE_G3A" >> "$GITHUB_ENV"
          echo "Built read-only OS paging-state probe $OS_PAGING_PROBE_G3A"
          P2_EXEC_PROBE_G3A="$(find port/fxcg -type f -name 'P2-EXEC-PROBE.g3a' -print -quit)"
          test -n "$P2_EXEC_PROBE_G3A"
          printf 'FXCG_P2_EXEC_PROBE_G3A=%s\n' "$P2_EXEC_PROBE_G3A" >> "$GITHUB_ENV"
          echo "Built hardware-only P2 execution probe $P2_EXEC_PROBE_G3A (not executed)"
          P2_FLAG_ISOLATION_PROBE_G3A="$(find port/fxcg -type f -name 'P2-FLAG-ISOLATION-PROBE.g3a' -print -quit)"
          test -n "$P2_FLAG_ISOLATION_PROBE_G3A"
          printf 'FXCG_P2_FLAG_ISOLATION_PROBE_G3A=%s\n' "$P2_FLAG_ISOLATION_PROBE_G3A" >> "$GITHUB_ENV"
          echo "Built hardware-only P2 flag-isolation probe $P2_FLAG_ISOLATION_PROBE_G3A (not executed)"

      - name: Upload read-only OS paging-state probe add-in
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fxcg50-os-paging-state-probe
          path: ${{ env.OS_PAGING_PROBE_G3A }}
          if-no-files-found: error

      - name: Upload read-only UTLB state probe add-in
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fxcg50-tlb-state-probe
          path: ${{ env.FXCG_TLB_STATE_PROBE_G3A }}
          if-no-files-found: error

      - name: Upload P2 execution probe add-in (hardware test only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fxcg50-p2-exec-probe-hardware
          path: ${{ env.FXCG_P2_EXEC_PROBE_G3A }}
          if-no-files-found: error

      - name: Upload P2 flag-isolation probe add-in (reset-sensitive hardware test)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fxcg50-p2-flag-isolation-probe
          path: ${{ env.FXCG_P2_FLAG_ISOLATION_PROBE_G3A }}
          if-no-files-found: error

      - name: Check out Casio CG50 emulator
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Heath123/casio-emu
          # Same pinned emulator revision used by fxOGL's hardware-independent
          # regression workflow; bump deliberately when the emulator changes.
          ref: 5d34e298b94be65f7ab0505d3c0f9b9ed802ac4b
          path: .cache/casio-emu
          fetch-depth: 1
          persist-credentials: false

      - name: Build headless Casio emulator
        run: |
          cmake -S tests/fxcg50-emulator/casio-emu-headless \
            -B build/casio-emu-headless \
            -DCASIO_EMU_SOURCE="$GITHUB_WORKSPACE/.cache/casio-emu"
          cmake --build build/casio-emu-headless --parallel 2

      - name: Run Picori add-in in Casio emulator
        run: timeout 120 build/casio-emu-headless/casio-emu-headless "$FXSDK_G3A"

      - name: Upload emulated calculator screen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: picori-fxcg50-emulated-screen
          path: emulated-screen.ppm
          if-no-files-found: ignore

      - name: Run P2 SR flag readback probe in Casio emulator
        run: timeout 120 build/casio-emu-headless/casio-emu-headless "$FXCG_P2_FLAG_ISOLATION_PROBE_G3A" --p2-flags

      - name: Upload P2 SR flag emulator screen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fxcg50-p2-sr-flag-emulator-screen
          path: emulated-screen.ppm
          if-no-files-found: ignore
